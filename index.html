<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shubhankar Paria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e1512;
    --ink-soft:#141d19;
    --paper:#f1efe6;
    --paper-dim:#c9c6b8;
    --line:#2a352f;
    --line-soft:#3a4640;
    --teal:#6fb8a3;
    --amber:#e0a95f;
    --radius:10px;
    --max:560px;
  }

  [data-theme="light"]{
    --ink:#f1efe6;
    --ink-soft:#e8e4d5;
    --paper:#14201c;
    --paper-dim:#4b564f;
    --line:#d8d4c4;
    --line-soft:#c3bfae;
    --teal:#2f7d67;
    --amber:#a9702a;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    margin:0;
    min-height:100vh;
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 18px;
    position:relative;
    overflow-x:hidden;
    transition:background .4s ease, color .4s ease;
  }

  /* faint blueprint grid, drifting */
  body::before{
    content:"";
    position:fixed;
    inset:-10%;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:42px 42px;
    opacity:0.14;
    animation:drift 60s linear infinite;
    pointer-events:none;
  }
  @keyframes drift{
    from{transform:translate(0,0);}
    to{transform:translate(42px,42px);}
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:var(--max);
    background:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:16px;
    padding:38px 34px 30px;
    opacity:0;
    transform:translateY(14px);
    animation:rise .7s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes rise{to{opacity:1; transform:translateY(0);}}

  /* terminal status line — signature element */
  .status-line{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--teal);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:26px;
    letter-spacing:.02em;
  }
  .status-line .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--teal);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--teal) 22%, transparent);
    flex:none;
  }
  #typed::after{
    content:"";
    display:inline-block;
    width:6px;height:12px;
    background:var(--teal);
    margin-left:2px;
    vertical-align:-2px;
    animation:blink 1s step-end infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  .theme-toggle{
    position:absolute;
    top:20px; right:20px;
    background:none;
    border:1px solid var(--line-soft);
    color:var(--paper);
    width:34px; height:34px;
    border-radius:50%;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
    transition:border-color .25s ease, transform .25s ease;
  }
  .theme-toggle:hover{border-color:var(--teal); transform:rotate(15deg);}
  .theme-toggle:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}

  .top{
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:8px;
  }

  .avatar-wrap{
    position:relative;
    flex:none;
    width:88px; height:88px;
  }
  .avatar-ring{
    position:absolute; inset:-4px;
    border-radius:50%;
    border:1px dashed var(--line-soft);
    animation:spin 24s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .avatar{
    width:88px; height:88px;
    border-radius:50%;
    object-fit:cover;
    background:var(--ink);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif;
    font-size:30px;
    color:var(--teal);
  }

  .id-block{min-width:0;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(24px,5vw,30px);
    line-height:1.1;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .role{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--paper-dim);
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .role .sep{color:var(--amber); margin:0 6px;}

  .rule{
    border:none;
    border-top:1px solid var(--line);
    margin:26px 0 20px;
  }

  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--paper-dim);
    margin:0 0 12px;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .link-row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 10px;
    border-radius:8px;
    text-decoration:none;
    color:var(--paper);
    border:1px solid transparent;
    transition:border-color .2s ease, background .2s ease, transform .2s ease;
    cursor:pointer;
    background:none;
    font-family:'Inter',sans-serif;
    width:100%;
    text-align:left;
  }
  .link-row:hover, .link-row:focus-visible{
    border-color:var(--line-soft);
    background:color-mix(in srgb, var(--teal) 6%, transparent);
    transform:translateX(3px);
  }
  .link-row:focus-visible{outline:2px solid var(--teal); outline-offset:1px;}

  .link-icon{
    flex:none;
    width:34px; height:34px;
    border-radius:8px;
    background:var(--ink);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    color:var(--teal);
  }
  .link-icon svg{width:16px; height:16px;}

  .link-text{flex:1; min-width:0;}
  .link-label{
    font-size:10.5px;
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--paper-dim);
    display:block;
    margin-bottom:2px;
  }
  .link-value{
    font-size:14.5px;
    display:block;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .link-action{
    flex:none;
    font-size:11px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--paper-dim);
    opacity:0;
    transition:opacity .2s ease, color .2s ease;
  }
  .link-row:hover .link-action, .link-row:focus-visible .link-action{opacity:1;}
  .link-action.copied{color:var(--teal); opacity:1;}

  .footer{
    margin-top:26px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
  }
  .availability{
    display:flex; align-items:center; gap:7px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--paper-dim);
  }
  .availability .dot{
    width:6px; height:6px; border-radius:50%;
    background:#7fca4f;
    box-shadow:0 0 0 3px color-mix(in srgb, #7fca4f 22%, transparent);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{50%{opacity:.4;}}

  .resume-btn{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--ink);
    background:var(--teal);
    border:none;
    padding:9px 14px;
    border-radius:7px;
    text-decoration:none;
    cursor:pointer;
    transition:filter .2s ease, transform .2s ease;
  }
  .resume-btn:hover{filter:brightness(1.08); transform:translateY(-1px);}
  .resume-btn:focus-visible{outline:2px solid var(--paper); outline-offset:2px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  @media (max-width:420px){
    .card{padding:28px 20px 24px;}
    .top{gap:14px;}
    .avatar, .avatar-wrap{width:72px; height:72px;}
    .role{white-space:normal;}
    .footer{flex-direction:column; align-items:flex-start;}
    .resume-btn{width:100%; text-align:center;}
  }
</style>
</head>
<body>

<script>
  // Typewriter status line
  const phrases = ["shubhankar@dev:~$ whoami", "> Shubhankar Paria — building things."];
  const typedEl = document.getElementById('typed');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduceMotion) {
    typedEl.textContent = phrases[0];
  } else {
    let phraseIdx = 0, charIdx = 0, deleting = false;
    function tick(){
      const current = phrases[phraseIdx];
      if (!deleting){
        charIdx++;
        typedEl.textContent = current.slice(0, charIdx);
        if (charIdx === current.length){
          deleting = true;
          setTimeout(tick, 1600);
          return;
        }
      } else {
        charIdx--;
        typedEl.textContent = current.slice(0, charIdx);
        if (charIdx === 0){
          deleting = false;
          phraseIdx = (phraseIdx + 1) % phrases.length;
        }
      }
      setTimeout(tick, deleting ? 30 : 55);
    }
    tick();
  }

  // Copy-to-clipboard for email / phone
  document.querySelectorAll('.link-row[data-copy]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const text = btn.getAttribute('data-copy');
      const actionEl = btn.querySelector('.link-action');
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      const original = actionEl.dataset.default || 'Copy';
      actionEl.textContent = 'Copied ✓';
      actionEl.classList.add('copied');
      setTimeout(() => {
        actionEl.textContent = original;
        actionEl.classList.remove('copied');
      }, 1500);
    });
  });

  // Theme toggle (in-memory for this session)
  const themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', () => {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    if (isLight) document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', 'light');
  });
</script>
